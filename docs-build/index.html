            {"data":{"leading":false,"html":"&lt;p&gt;ВоркТаймер — плагин для учёта времени в карточке задачи Трекера. Запускает таймер одним нажатием и автоматически записывает затраченное время в ворклоги.&lt;/p&gt;\n&lt;h2 id=\"vozmozhnosti\"&gt;&lt;a href=\"index.html#vozmozhnosti\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможности&lt;/span&gt;&lt;/a&gt;Возможности&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Запуск и остановка таймера в карточке задачи&lt;/li&gt;\n&lt;li&gt;Автоматическая запись времени в ворклоги при остановке&lt;/li&gt;\n&lt;li&gt;Отображение суммарного времени по задаче&lt;/li&gt;\n&lt;li&gt;История сессий с датой и длительностью&lt;/li&gt;\n&lt;li&gt;Поддержка одновременных таймеров для разных задач&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ustanovka\"&gt;&lt;a href=\"index.html#ustanovka\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка&lt;/span&gt;&lt;/a&gt;Установка&lt;/h2&gt;\n&lt;p&gt;Плагин устанавливается администратором организации из каталога плагинов Трекера. После установки дополнительная настройка не требуется — таймер появляется в карточке задачи автоматически.&lt;/p&gt;\n&lt;h2 id=\"ispolzovanie\"&gt;&lt;a href=\"index.html#ispolzovanie\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование&lt;/span&gt;&lt;/a&gt;Использование&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Откройте карточку задачи в Трекере&lt;/li&gt;\n&lt;li&gt;В блоке плагина нажмите «Старт»&lt;/li&gt;\n&lt;li&gt;Работайте над задачей — таймер отсчитывает время в фоне&lt;/li&gt;\n&lt;li&gt;По завершении нажмите «Стоп»&lt;/li&gt;\n&lt;li&gt;Время автоматически запишется в ворклог задачи&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"chastye-voprosy\"&gt;&lt;a href=\"index.html#chastye-voprosy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Частые вопросы&lt;/span&gt;&lt;/a&gt;Частые вопросы&lt;/h2&gt;\n&lt;h3 id=\"mozhno-li-zapustit-neskolko-tajmerov-odnovremenno\"&gt;&lt;a href=\"index.html#mozhno-li-zapustit-neskolko-tajmerov-odnovremenno\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Можно ли запустить несколько таймеров одновременно?&lt;/span&gt;&lt;/a&gt;Можно ли запустить несколько таймеров одновременно?&lt;/h3&gt;\n&lt;p&gt;Да. Каждый таймер привязан к своей задаче, поэтому можно вести несколько параллельно.&lt;/p&gt;\n&lt;h3 id=\"chto-proizojdyot,-esli-zakryt-brauzer\"&gt;&lt;a href=\"index.html#chto-proizojdyot,-esli-zakryt-brauzer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что произойдёт, если закрыть браузер?&lt;/span&gt;&lt;/a&gt;Что произойдёт, если закрыть браузер?&lt;/h3&gt;\n&lt;p&gt;Таймер остановится. Время, которое успело накопиться до закрытия, не запишется в ворклог автоматически — запустите таймер заново при следующем открытии.&lt;/p&gt;\n&lt;h3 id=\"kto-vidit-zapisannoe-vremya\"&gt;&lt;a href=\"index.html#kto-vidit-zapisannoe-vremya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кто видит записанное время?&lt;/span&gt;&lt;/a&gt;Кто видит записанное время?&lt;/h3&gt;\n&lt;p&gt;Ворклоги видны всем участникам задачи согласно правам доступа в Трекере.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.50.6"}],"vcsPath":"index.md"},"headings":[{"title":"Возможности","href":"index.html#vozmozhnosti","level":2},{"title":"Установка","href":"index.html#ustanovka","level":2},{"title":"Использование","href":"index.html#ispolzovanie","level":2},{"title":"Частые вопросы","href":"index.html#chastye-voprosy","level":2,"items":[{"title":"Можно ли запустить несколько таймеров одновременно?","href":"index.html#mozhno-li-zapustit-neskolko-tajmerov-odnovremenno","level":3},{"title":"Что произойдёт, если закрыть браузер?","href":"index.html#chto-proizojdyot,-esli-zakryt-brauzer","level":3},{"title":"Кто видит записанное время?","href":"index.html#kto-vidit-zapisannoe-vremya","level":3}]}],"title":"ВоркТаймер"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc":true,"search":true,"feedback":true}}
